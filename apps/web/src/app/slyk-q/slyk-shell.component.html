<div
    class="slyk-viewport"
    [class.pointer]="nav.pointerActive()"
    (wheel)="onWheel($event)"
    (contextmenu)="onContextMenu($event)"
>
    <div class="slyk-stage" [style.transform]="stageTransform()">
        @if (tv.playback(); as playback) {
            <div
                class="slyk-player"
                [class]="'slyk-player slyk-player--' + nav.frame()"
                data-player-shortcuts-suspended
            >
                <app-web-player-view
                    [playbackSessionKey]="tv.playbackSessionKey()"
                    [streamUrl]="playback.streamUrl"
                    [title]="playback.title"
                    [playback]="playback"
                    [playerOverride]="player()"
                    [volume]="volume()"
                />
            </div>
        }
        <router-outlet />
        @if (players.restartNotice()) {
            <!-- Slyk Q MessageBox: title-blue box, centred -->
            <div class="slyk-message" role="alertdialog" aria-labelledby="slyk-message-text">
                <div id="slyk-message-text">
                    4K and Dolby playback is now set up. Close and reopen IPTVnator
                    once to switch it on.
                </div>
                <button type="button" class="slyk-message-ok" (click)="players.dismissRestartNotice()">
                    OK
                </button>
            </div>
        }
    </div>
</div>

<app-slyk-template title="Playlists" />

<div class="description slyk-abs">{{ description() }}</div>

<!-- menu: 540,385 1002×697, itemHeight 78 -->
<div class="slyk-rows" style="left: 540px; top: 384px; width: 1002px; height: 624px"></div>
@if (selected() || index() === playlists().length) {
    <div
        class="slyk-selectbar"
        style="left: 540px; width: 1002px; height: 78px"
        [style.top.px]="385 + (index() - pageStart()) * 78"
    ></div>
}
@for (playlist of visible(); track playlist._id; let i = $index) {
    <div
        class="row slyk-abs"
        [style.top.px]="385 + i * 78"
        role="option"
        tabindex="-1"
        [attr.aria-selected]="pageStart() + i === index()"
        (mouseenter)="index.set(pageStart() + i)"
        (click)="open(playlist)"
        (keydown.enter)="open(playlist)"
    >
        <span class="name slyk-nowrap">{{ label(playlist) }}</span>
        @if (isActive(playlist)) {
            <span class="current">Current</span>
        }
    </div>
}

<!-- "+ Add playlist" row, as the first entry of the menu -->
@if (playlists().length < 8) {
    <div
        class="row add slyk-abs"
        role="button"
        tabindex="-1"
        [style.top.px]="385 + visible().length * 78"
        (mouseenter)="index.set(playlists().length)"
        (click)="add()"
        (keydown.enter)="add()"
    >
        <span class="name">+ Add playlist…</span>
    </div>
}

<app-slyk-buttons [labels]="['Add M3U link', 'Add Xtream Codes', 'Add M3U file', 'Manage sources']" />

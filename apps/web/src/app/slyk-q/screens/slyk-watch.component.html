<!-- the whole picture: click brings up the banner, like OK -->
<div
    class="surface slyk-abs"
    role="button"
    tabindex="-1"
    aria-label="Show or hide programme information"
    (click)="nav.press('ok')"
    (keydown.enter)="nav.press('ok')"
></div>

@if (nav.pointerActive() && !miniGuide()) {
    <!-- mouse bar in the SecondInfoBar top band (0,0 1920×159) -->
    <div class="mouse-bar slyk-abs">
        @for (action of mouseActions; track action.label) {
            <span
                class="mouse-button"
                role="button"
                tabindex="-1"
                (click)="action.run()"
                (keydown.enter)="action.run()"
                >{{ action.label }}</span
            >
        }
    </div>
}

@if (numberEntry()) {
    <!-- NumberZap 54,783 540×270 -->
    <div class="numberzap slyk-abs">
        <div class="nz-name">{{ numberTarget() }}</div>
        <div class="nz-number slyk-bold">{{ numberEntry() }}</div>
    </div>
}

@if (miniGuide()) {
    <app-slyk-mini-guide (closed)="closeMiniGuide()" />
}
